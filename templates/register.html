{% extends 'base.html' %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-bg d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-card card shadow-lg">

    <div class="auth-header text-center py-4">
      <div class="auth-logo mb-2">
        <i class="bi bi-lightning-charge-fill"></i>
      </div>
      <h3 class="fw-bold mb-0">TaskLink</h3>
      <p class="text-white-50 small mb-0">Create your account</p>
    </div>

    <div class="card-body p-4">
      <h5 class="text-center mb-4 fw-semibold text-dark">Register</h5>

      <form method="POST" action="{{ url_for('auth.register') }}">

        <div class="mb-3">
          <label class="form-label fw-semibold">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-person text-muted"></i>
            </span>
            <input type="text" name="name" class="form-control border-start-0 ps-0"
                   placeholder="Your name" required/>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-envelope text-muted"></i>
            </span>
            <input type="email" name="email" class="form-control border-start-0 ps-0"
                   placeholder="you@example.com" required/>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0">
              <i class="bi bi-lock text-muted"></i>
            </span>
            <input type="password" name="password" class="form-control border-start-0 ps-0"
                   placeholder="Minimum 6 characters" required/>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">I want to join as</label>
          <div class="d-flex gap-3">
            <div class="form-check flex-fill role-option p-3 rounded border">
              <input class="form-check-input" type="radio" name="role" value="CLIENT" id="roleClient" required/>
              <label class="form-check-label fw-semibold" for="roleClient">
                <i class="bi bi-briefcase me-1 text-primary"></i> Client
                <small class="d-block text-muted fw-normal">Post tasks & hire</small>
              </label>
            </div>
            <div class="form-check flex-fill role-option p-3 rounded border">
              <input class="form-check-input" type="radio" name="role" value="FREELANCER" id="roleFreelancer"/>
              <label class="form-check-label fw-semibold" for="roleFreelancer">
                <i class="bi bi-code-slash me-1 text-success"></i> Freelancer
                <small class="d-block text-muted fw-normal">Apply & earn</small>
              </label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-person-check me-2"></i>Create Account
        </button>
      </form>

      <hr class="my-3"/>
      <p class="text-center text-muted small mb-0">
        Already have an account?
        <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Login here</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
