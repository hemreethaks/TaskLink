{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-bg d-flex align-items-center justify-content-center min-vh-100">
  <div class="auth-card card shadow-lg">

    <!-- Header -->
    <div class="auth-header text-center py-4">
      <div class="auth-logo mb-2">
        <i class="bi bi-link-45deg"></i>
      </div>
      <h3 class="fw-bold mb-0 letter-space">TaskLink</h3>
      <p class="text-white-50 small mb-0">Freelance Micro-Task Platform</p>
    </div>

    <div class="card-body p-4">
      <h5 class="text-center mb-4 fw-semibold text-secondary">Sign in to your account</h5>

      <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold text-secondary small">USERNAME / EMAIL</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text auth-icon-box border-end-0">
              <i class="bi bi-person text-secondary"></i>
            </span>
            <input type="email" name="email" class="form-control auth-input border-start-0 ps-0"
                   placeholder="Enter your email" required/>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold text-secondary small">PASSWORD</label>
          <div class="input-group auth-input-group">
            <span class="input-group-text auth-icon-box border-end-0">
              <i class="bi bi-lock text-secondary"></i>
            </span>
            <input type="password" name="password" class="form-control auth-input border-start-0 ps-0"
                   placeholder="Enter your password" required/>
          </div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe"/>
            <label class="form-check-label small text-secondary" for="rememberMe">Remember me</label>
          </div>
          <a href="#" class="small text-secondary text-decoration-none">Forgot Username / Password?</a>
        </div>

        <button type="submit" class="btn btn-auth w-100 py-2 fw-semibold">
          LOGIN
        </button>
      </form>

      <hr class="my-3"/>
      <p class="text-center text-muted small mb-0">
        New here?
        <a href="{{ url_for('auth.register') }}" class="text-secondary fw-semibold">Create an account</a>
      </p>
    </div>

  </div>
</div>
{% endblock %}
